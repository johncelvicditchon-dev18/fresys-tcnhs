<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>official-ballot-tcnhs</title>
  <link rel="icon" href="assets/pictures/tcnhs_logo.png">
  <link rel="stylesheet" href="css/ballot.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap">
  <style>
    /* generic section styling (matches the grouped original selectors) so custom positions work too */
    .candidate-section {
      background: var(--card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
      margin-bottom: 24px;
    }
    .candidate-section .headbox h2 {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 700;
      margin: 0;
      color: var(--text-dark);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .candidate-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      justify-items: center;
    }
    /* first rendered section clears the fixed header */
    .ballot-first {
      margin-top: 110px;
    }
    #loadingNotice {
      max-width: 1400px;
      margin: 120px auto;
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      font-family: 'Inter', system-ui, sans-serif;
    }
    @media (max-width: 768px) {
      .candidate-section { padding: 18px 16px; }
      .candidate-section .headbox h2 { font-size: 13px; }
    }
    @media (max-width: 479px) {
      .candidate-section { padding: 12px 10px; border-radius: 12px; margin-bottom: 16px; }
      .candidate-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
      .ballot-first { margin-top: 240px; }
    }
  </style>
</head>

<body>

  <div id="loadingNotice">Preparing your ballot...</div>

  <div class="layout" id="app" style="display:none">

    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <img src="assets/pictures/tcnhs_logo.png" alt="School Logo">
        <img src="assets/pictures/sslg_logo.jpg" alt="SSLG Logo">
      </div>
      <div class="header-header">
        <h2 id="schoolName">TANGUB CITY NATIONAL HIGH SCHOOL</h2>
        <h2 id="electionName">SUPREME STUDENT LEARNER GOVERNMENT ELECTION</h2>
        <h2 id="academicYear">2026-2027</h2>
      </div>
      <div class="header-right">
        <div class="header-profile" id="header-profile">
          <div class="header-avatar">
            <i class="ph ph-user"></i>
          </div>
          <div class="header-student-info">
            <span class="header-student-name" id="stuName">Student</span>
            <span class="header-student-section" id="stuMeta">Grade</span>
          </div>
          <div class="header-dropdown" id="header-dropdown">
            <div class="header-dropdown-header">
              <div class="header-dropdown-avatar">
                <i class="ph ph-user"></i>
              </div>
              <div class="header-dropdown-info">
                <span class="header-dropdown-name" id="ddName">Student</span>
                <span class="header-dropdown-role" id="ddMeta">Grade</span>
              </div>
            </div>
            <div class="header-dropdown-divider"></div>
            <button class="header-dropdown-item header-dropdown-logout" onclick="ballotLogout()">
              <i class="ph ph-sign-out"></i>
              <span>Log Out</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- CANDIDATE SECTIONS (rendered by JS) -->
    <div id="sections"></div>

    <section class="buttonnss">
      <div class="button-groups">
        <button type="button" class="cancelvote" onclick="ballotLogout()">Cancel</button>
        <button type="button" class="review" onclick="review()">Review your votes</button>
      </div>
    </section>

  </div>


  <!-- REVIEW MODAL -->
  <div id="reviewModal" class="review-modal">
    <div class="review-content">

      <div class="review-header">
        <div class="student-info">
          <div class="flexinfo"><strong>ID: </strong><input type="text" id="ballot_id" readonly></div>
          <div class="flexinfo"><strong>STUDENT: </strong><input type="text" id="ballot_name" readonly></div>
          <div class="flexinfo"><strong>GENDER: </strong><input type="text" id="ballot_gender" readonly></div>
          <div class="flexinfo"><strong>GRADE LEVEL: </strong><input type="text" id="ballot_grade" readonly></div>
          <div class="flexinfo"><strong>SECTION: </strong><input type="text" id="ballot_section" readonly></div>
        </div>

        <div class="review-logo">
          <img src="assets/pictures/sslg_logo.jpg" alt="SSLG Logo">
        </div>
      </div>

      <h2>REVIEW YOUR VOTES</h2>

      <div id="reviewBody" class="review-body">
        <div class="section-group-vote" id="reviewGrid"></div>
      </div>

      <div class="review-actions">
        <button type="button" class="btn-cancel" onclick="closeReview()">GO BACK</button>
        <button type="button" class="btn-confirm" onclick="confirm_submit()">CONFIRM &amp; SUBMIT</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/ballot.js"></script>
</body>

</html>
