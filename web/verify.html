<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" href="assets/pictures/tcnhs_logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <title>Verification | Tangub City NHS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
  <style>
    .verify-switch {
      display: flex;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .verify-switch button {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.35);
      font-family: 'Inter', system-ui, sans-serif;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .verify-switch button.active {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      box-shadow: 0 4px 12px rgba(45, 17, 233, 0.35);
    }

    .labelcon {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 6px;
    }

    .labelforinput {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .ph-fingerprint,
    .ph-star {
      position: absolute;
      top: 14px;
      left: 14px;
      color: rgba(255, 255, 255, 0.3);
      pointer-events: none;
      font-size: 15px;
    }

    .ph-star {
      left: auto;
      right: 38px;
    }

    .qr-box {
      height: 300px;
      padding: 10px;
      width: 100%;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.35);
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .qr-box i {
      font-size: 60px;
      margin-bottom: 10px;
      color: var(--secondary);
    }

    #reader {
      width: 100%;
      height: 100%;
    }

    .ph-qr-code {
      margin-right: 8px;
    }

    #qrVerify {
      display: none;
    }

    .account {
      color: rgba(255, 255, 255, 0.35);
    }
  </style>
</head>

<body>

  <div class="image"></div>
  <main class="container">
    <section class="box">

      <button class="top-back" onclick="location.href='index.html'">
        <i class="ph ph-x"></i>
      </button>
      <div class="box-logo">
        <img src="assets/pictures/tcnhs_logo.png" alt="Logo">
      </div>
      <h3>Verification</h3>
      <p class="sub">Choose how you want to verify</p>


      <div class="verify-switch">
        <button type="button" class="active" id="maniBtn">Code</button>
        <button type="button" id="qrBtn"><i class="ph ph-qr-code"></i>QR Code</button>
      </div>


      <div class="success" id="success"></div>
      <div class="error" id="error"></div>


      <form id="manualVerify">
        <div class="labelcon">
          <label class="labelforinput">Verification Code</label>
        </div>
        <div class="input-group">
          <i class="ph ph-fingerprint"></i>
          <input type="text" id="code" name="code" required maxlength="20" autocomplete="off">
        </div>

        <div class="labelcon">
          <label class="labelforinput">Grade Level</label>
        </div>
        <div class="input-group">
          <select id="gradeLevel" name="grade_level" required>
            <option value="" disabled selected>Select Grade Level</option>
            <option value="Grade 7">Grade 7</option>
            <option value="Grade 8">Grade 8</option>
            <option value="Grade 9">Grade 9</option>
            <option value="Grade 10">Grade 10</option>
            <option value="Grade 11">Grade 11</option>
            <option value="Grade 12">Grade 12</option>
          </select>
          <i class="ph ph-star"></i>
          <i class="ph ph-caret-down"></i>
        </div>

        <button type="submit" class="login-btn" id="submitBtn">
          <i class="fa-solid fa-right-to-bracket"></i> Continue
        </button>
      </form>


      <div id="qrVerify">
        <div class="qr-box">
          <div id="reader"></div>
        </div>
        <p class="sub" style="margin-top:15px;font-size:13px">
          Camera access will start automatically
        </p>
      </div>


      <div id="studentInfo">
        <div><input hidden id="student_name"></div>
        <div> <input hidden id="verification_code"></div>
        <div> <input hidden id="grade_level"></div>
        <div><input hidden id="section"></div>
      </div>

      <div class="account">
        Please contact your class adviser for student registration.
      </div>

    </section>
  </main>


  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script type="module" src="js/verify.js"></script>
</body>

</html>
